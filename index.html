<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen">

  <div class="text-center p-8 max-w-xl">
    <h1 class="text-4xl font-extrabold mb-4">SyncPulse</h1>
    <p class="text-slate-400 mb-8">Start your 7-day free trial today!</p>
    
    <button onclick="startCheckout()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition">
      Start 7-Day Free Trial
    </button>
  </div>

  <script>
    async function startCheckout() {
      try {
        const response = await fetch('/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        const data = await response.json();

        if (response.ok && data.url) {
          window.location.href = data.url;
        } else {
          alert('Server Error: ' + (data.error || 'Server responded with status ' + response.status));
        }
      } catch (error) {
        alert('Network/Fetch Error: ' + error.message);
      }
    }
  </script>

</body>
</html>
