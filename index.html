<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncPlus Enterprise Core</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #111827;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 500px;
            border: 1px solid #1f2937;
        }
        h2 { margin-top: 0; color: #ffffff; }
        p { color: #9ca3af; font-size: 14px; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
        }
        button.btn-primary {
            background-color: #10b981;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: 600;
            margin-bottom: 12px;
        }
        button.btn-primary:hover {
            background-color: #059669;
        }
        .btn-upgrade {
            background-color: #6366f1;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: 600;
        }
        .btn-upgrade:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>SyncPlus Enterprise Core</h2>
        <p>Autonomous Multi-Channel Inventory Engine - Shopify Connected</p>
        
        <form action="/commit" method="POST">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" name="productName" placeholder="e.g. Ergonomic Keyboard" required>
            </div>
            <div class="form-group">
                <label for="stockQuantity">Initial Stock Quantity</label>
                <input type="number" id="stockQuantity" name="stockQuantity" placeholder="e.g. 250" required>
            </div>
            <button type="submit" class="btn-primary">Commit Product to Database</button>
        </form>

        <a href="https://buy.stripe.com/dRm00j2UF9K81LufllgA800" target="_blank" style="text-decoration: none;">
            <button class="btn-upgrade">Upgrade to Managed Audit ($99)</button>
        </a>
    </div>
</body>
</html>
